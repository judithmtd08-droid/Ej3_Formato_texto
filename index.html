<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ejercicio 3 - Tablas</title>
    <link rel="stylesheet" href="../Ej3_Formato_texto/css/Ej3.css">
</head>
<body>

    <table class="tabla1">
        <caption>Tabla prueba 1</caption>

        <tr>
            <th>columna 1</th>
            <th>columna 2</th>
            <th>columna 3</th>
            <th>columna 4</th>
        </tr>

        <tr>
            <td>col1</td>
            <td colspan="2">col2</td>
            <td rowspan="2">col3</td>
        </tr>

        <tr>
            <td>colum1</td>
            <td>colum2</td>
            <td>colum4</td>
        </tr>
    </table>

    <table class="tabla2">
        <caption>Tabla prueba 2</caption>

        <tr>
            <th>columna 1</th>
            <th>columna 2</th>
            <th>columna 3</th>
            <th>columna 4</th>
        </tr>

        <tr>
            <td class="verde">col1</td>
            <td class="verde" colspan="2">col2</td>
            <td class="verde">col3</td>
        </tr>

        <tr>
            <td>colum1</td>
            <td rowspan="2">colum2</td>
            <td>colum3</td>
            <td>colum4</td>
        </tr>

        <tr>
            <td class="verde">column1</td>
            <td class="verde">column3</td>
            <td class="verde">column4</td>
        </tr>

        <tr>
            <td>colu1</td>
            <td>colu2</td>
            <td>colu3</td>
            <td>colu4</td>
        </tr>
    </table>

</body>
</html>
